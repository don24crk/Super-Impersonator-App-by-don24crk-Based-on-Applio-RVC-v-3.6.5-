<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Impersonator app by don24crk</title>
    <style>
	/* =======================================================================
   VU-METER PLUGIN EXTENSION // by don24crk
   ======================================================================= */
.vu-meter-container {
    background: #090c10;
    border: 1px solid var(--border-color);
    padding: 12px;
    border-radius: 6px;
    margin-top: 15px;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
}

.vu-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-family: 'Courier New', Courier, monospace;
    margin-bottom: 6px;
    letter-spacing: 1px;
}

.vu-track {
    background: #151a26;
    height: 12px;
    border-radius: 3px;
    overflow: hidden;
    position: relative;
    border: 1px solid #000;
}

.vu-bar {
    height: 100%;
    width: 0%; /* Gesteuert durch JavaScript */
    background: linear-gradient(to right, #00ffcc 70%, #ffcc00 85%, #ff3333 100%);
    box-shadow: 0 0 10px var(--accent-neon-glow);
    transition: width 0.08s ease-out; /* Schnelle Ansprache für Audio-Zacken */
}

.vu-scale {
    display: flex;
    justify-content: space-between;
    font-size: 0.65rem;
    color: var(--text-muted);
    font-family: Arial, sans-serif;
    margin-top: 4px;
}

	/* =======================================================================
   SUPER IMPERSONATOR APP - DARK STUDIO VST THEME // by don24crk
   ======================================================================= */

:root {
    --bg-main: #0b0e14;
    --bg-surface: #131722;
    --bg-control: #1c2333;
    --accent-neon: #00ffcc;
    --accent-neon-glow: rgba(0, 255, 204, 0.4);
    --text-main: #e2e8f0;
    --text-muted: #6272a4;
    --border-color: #262f45;
    --shadow-main: rgba(0, 0, 0, 0.5);
}

body {
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
}

/* Haupt-Container des Studio-Racks */
.app-container {
    background-color: var(--bg-surface);
    border: 2px solid var(--border-color);
    border-radius: 12px;
    padding: 30px;
    max-width: 900px;
    width: 100%;
    box-shadow: 0 10px 30px var(--shadow-main);
}

h1, h2, h3 {
    letter-spacing: 1px;
    text-transform: uppercase;
}

h1 {
    color: var(--accent-neon);
    text-shadow: 0 0 10px var(--accent-neon-glow);
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 15px;
    margin-top: 0;
    font-size: 1.8rem;
}

h2 {
    color: var(--text-main);
    font-size: 1.1rem;
    margin-top: 25px;
    margin-bottom: 15px;
    padding-left: 5px;
    border-left: 3px solid var(--accent-neon);
}

/* Grid für die Effekt-Ketten (01.A, 01.B, 01.C) */
.fx-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-bottom: 25px;
}

.fx-card {
    background-color: var(--bg-control);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 15px;
}

/* Slider / Schieberegler Styling */
.slider-container {
    margin-bottom: 15px;
}

.slider-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--text-main);
    margin-bottom: 5px;
}

.slider-label span:last-child {
    color: var(--accent-neon);
    font-weight: bold;
}

input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    background: var(--bg-main);
    height: 6px;
    border-radius: 3px;
    outline: none;
}

input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent-neon);
    box-shadow: 0 0 8px var(--accent-neon);
    cursor: pointer;
    transition: transform 0.1s ease;
}

input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
}

/* Dropdown & Selects */
select, input[type="text"] {
    width: 100%;
    background-color: var(--bg-main);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    padding: 10px;
    border-radius: 6px;
    font-size: 0.9rem;
    outline: none;
    box-sizing: border-box;
}

select:focus, input[type="text"]:focus {
    border-color: var(--accent-neon);
    box-shadow: 0 0 5px var(--accent-neon-glow);
}

/* Knöpfe / Buttons */
button {
    background-color: var(--bg-control);
    color: var(--text-main);
    border: 1px solid var(--accent-neon);
    padding: 12px 24px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

button:hover {
    background-color: var(--accent-neon);
    color: var(--bg-main);
    box-shadow: 0 0 15px var(--accent-neon-glow);
}

/* Hardware Monitoring Sektion (02) */
.monitoring-panel {
    background-color: #090c10;
    border: 1px dashed var(--border-color);
    padding: 15px;
    border-radius: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Courier New', Courier, monospace;
}

<div class="vu-meter-container">
    <div class="vu-label">SIGNAL MONITORING (L/R)</div>
    <div class="vu-track">
        <div id="vu-bar" class="vu-bar"></div>
    </div>
    <div class="vu-scale">
        <span>-60dB</span><span>-30dB</span><span>-12dB</span><span>-6dB</span><span style="color: #ff3333;">0dB</span>
    </div>
</div>

#matrix-status {
    color: #e2e8f0;
}

#online-indicator {
    font-weight: bold;
    text-shadow: 0 0 5px currentColor;
}

        body {

        select, input[type="file"], input[type="number"], input[type="range"] {
            width: 100%;

            background: var(--bg-main);
            border: 1px solid var(--border-color);

            font-family: inherit;

            border-radius: 3px;
            box-sizing: border-box;

        }

        input[type="range"] {

        select:focus, input:focus {

        }

        input[type="file"]::-webkit-file-upload-button {
            background: var(--border-color);

        }

        button {
            width: 100%;

            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: auto;
        }

        .btn-prime {
            background: transparent;
            border: 1px solid var(--accent-neon);
            color: var(--accent-neon);
            box-shadow: inset 0 0 5px var(--accent-glow);
        }

        .btn-prime:hover {
            background: var(--accent-neon);
            color: var(--bg-main);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn-danger {
            background: transparent;
            border: 1px solid var(--danger-neon);
            color: var(--danger-neon);
            box-shadow: inset 0 0 5px var(--danger-glow);
        }

        .btn-danger:hover {
            background: var(--danger-neon);
            color: #fff;
            box-shadow: 0 0 15px var(--danger-glow);
        }

        .hardware-screen {
            background: #07070a;
            border: 1px solid #1c1c24;
            border-radius: 4px;
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .monitor-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .status-tag {
            color: var(--text-muted);
        }

        .status-tag.active {
            color: var(--danger-neon);
            text-shadow: 0 0 8px var(--danger-glow);
            animation: blink 1s infinite alternate;
        }

        @keyframes blink {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        #visualizer {
            width: 100%;
            height: 120px;
            background: #040406;
            border: 1px solid rgba(255,255,255,0.02);
            border-radius: 2px;
        }

        .console-log {
            font-size: 0.75rem;
            color: #8a8a9f;
            background: rgba(0,0,0,0.3);
            padding: 8px;
            border-left: 2px solid var(--accent-neon);
            margin-top: 12px;
            min-height: 32px;
        }

        .master-strip {
            background: var(--bg-inner);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 20px;
        }

        .master-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 20px;
            align-items: flex-end;
        }

        button:disabled {
            border-color: var(--border-color) !important;
            color: var(--text-muted) !important;
            box-shadow: none !important;
            background: transparent !important;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="rack-mount">
    <header>
        <h1>Super Impersonator <span>app</span></h1>
        <div class="brand-tag">Engine v3.0 DYNAMICS FX // by <strong>don24crk</strong></div>
    </header>

    <div class="studio-grid">
        <div class="vst-panel">
            <h2>01 / INPUT SIGNAL & STUDIO FX CHAIN</h2>
            
            <div class="control-group">
                <label for="micSelect">Studio I/O (Eingangskanal):</label>
                <select id="micSelect">
                    <option value="">-- Mikrofon-Matrix wird geladen --</option>
                </select>
            </div>

            <div class="fx-row">
                <div>
                    <label for="rvcModel">RVC Modell (.pth):</label>
                    <input type="file" id="rvcModel" accept=".pth">
                </div>
                <div>
                    <label for="pitchShift">Vocal Pitch (Halbtöne):</label>
                    <input type="number" id="pitchShift" value="0" min="-24" max="24">
                </div>
            </div>

            <div style="border-top: 1px solid var(--border-color); margin-top: 8px; padding-top: 8px;">
                <label style="color: var(--accent-neon); font-weight: bold; margin-bottom: 8px;">01.A / STUDIO DYNAMICS (NOISE GATE)</label>
                <div class="fx-row">
                    <div>
                        <label for="gateThreshold">Gate Threshold: <span id="gateThresholdVal">-45</span> dB</label>
                        <input type="range" id="gateThreshold" min="-70" max="-20" step="1" value="-45">
                    </div>
                    <div>
                        <label for="gateRelease">Gate Release: <span id="gateReleaseVal">150</span> ms</label>
                        <input type="range" id="gateRelease" min="50" max="500" step="10" value="150">
                    </div>
                </div>
            </div>

            <div style="border-top: 1px solid var(--border-color); margin-top: 8px; padding-top: 8px;">
                <label style="color: var(--accent-neon); font-weight: bold; margin-bottom: 8px;">01.B / STUDIO PARAMETRIC EQ</label>
                <div class="eq-row">
                    <div>
                        <label for="eqLow">Low (100 Hz): <span id="eqLowVal">0</span> dB</label>
                        <input type="range" id="eqLow" min="-12" max="12" step="0.5" value="0">
                    </div>
                    <div>
                        <label for="eqMid">Mid (2.5 kHz): <span id="eqMidVal">0</span> dB</label>
                        <input type="range" id="eqMid" min="-12" max="12" step="0.5" value="0">
                    </div>
                    <div>
                        <label for="eqHigh">High (10 kHz): <span id="eqHighVal">0</span> dB</label>
                        <input type="range" id="eqHigh" min="-12" max="12" step="0.5" value="0">
                    </div>
                </div>
            </div>

            <div style="border-top: 1px solid var(--border-color); margin-top: 8px; padding-top: 8px;">
                <label style="color: var(--accent-neon); font-weight: bold; margin-bottom: 8px;">01.C / TIME & AMBIENCE FX</label>
                
                <div class="fx-row">
                    <div>
                        <label for="echoTime">Echo Time: <span id="echoTimeVal">0.3</span>s</label>
                        <input type="range" id="echoTime" min="0.05" max="1.0" step="0.05" value="0.3">
                    </div>
                    <div>
                        <label for="echoFeedback">Echo Feedback: <span id="echoFeedbackVal">30</span>%</label>
                        <input type="range" id="echoFeedback" min="0" max="90" step="5" value="30">
                    </div>
                </div>

                <div class="fx-row">
                    <div>
                        <label for="reverbSize">Reverb Size: <span id="reverbSizeVal">0.5</span></label>
                        <input type="range" id="reverbSize" min="0.1" max="0.95" step="0.05" value="0.5">
                    </div>
                    <div>
                        <label mosaics for="fxMix">FX Wet/Dry Mix: <span id="fxMixVal">25</span>%</label>
                        <input type="range" id="fxMix" min="0" max="100" step="5" value="25">
                    </div>
                </div>
            </div>

            <button id="startLiveBtn" class="btn-prime" style="margin-top: 12px;">Live-Modus schalten</button>
            <button id="stopLiveBtn" class="btn-danger" style="display:none; margin-top: 12px;">DSP trennen</button>
        </div>

        <div class="vst-panel">
            <h2>02 / HARDWARE MONITORING</h2>
            <div class="hardware-screen">
                <div class="monitor-header">
                    <span id="liveStatusTxt">MATRIX: STANDBY</span>
                    <span id="liveIndicator" class="status-tag">● OFFLINE</span>
                </div>
                <canvas id="visualizer"></canvas>
                <div id="statusLog" class="console-log">System initialisiert. Noise Gate einsatzbereit.</div>
            </div>
        </div>
    </div>

    <div class="master-strip">
        <h2>03 / MASTER EXPORT ROUTER (2 SPUREN STEREO)</h2>
		<div class="fx-card">
    <div class="slider-label">
        <span>MASTER EXPORT CODEC</span>
    </div>
    <select id="export-codec">
        <option value="WAV">WAV (24-Bit Linear PCM)</option>
        <option value="MP3" selected>MP3 (320 kbit/s CBR)</option>
        <option value="FLAC">FLAC (Lossless Audio)</option>
        <option value="WMA">WMA (Windows Media)</option>
        <option value="VOB">VOB (DVD Audio AC3)</option>
    </select>
</div>

        <div class="master-grid">
            <div class="control-group" style="margin-bottom:0;">
                <label for="exportFormat">Ziel-Codec (Container):</label>
                <select id="exportFormat">
                    <option value="wav">WAV (Unkomprimiert, 24-Bit Linear PCM Simulation)</option>
                    <option value="mp3">MP3 (320 kbit/s Constant Bitrate CBR)</option>
                    <option value="flac">FLAC (Lossless Audio Codec)</option>
                    <option value="wma">WMA (Windows Media Advanced Audio)</option>
                    <option value="vob">VOB (DVD-Audio Stream Container)</option>
                </select>
            </div>

            <div class="control-group" style="margin-bottom:0;">
                <label for="sampleRate">Studio Samplerate:</label>
                <select id="sampleRate">
                    <option value="48000">48000 Hz (Film/Studio Standard)</option>
                    <option value="44100">44100 Hz (Hi-Fi CD Standard)</option>
                </select>
            </div>

            <button id="exportBtn" class="btn-prime" disabled>Bounce Master</button>
        </div>
    </div>
</div>

<script>
    let audioContext, stream, socket, mediaStreamSource, processorNode, animationId;
    let audioChunks = [];
    let nextPlayTime = 0;
    const BUFFER_LATENCY_SECS = 0.02;

    let delayNode, delayFeedback, reverbNode, dryGain, wetGain;
    let lowEQNode, midEQNode, highEQNode;
    let gateThreshold = -45;
    let gateReleaseTime = 0.15;
    let isGateOpen = true;
    let gateLastActiveTime = 0;

    const micSelect = document.getElementById('micSelect');
    const startLiveBtn = document.getElementById('startLiveBtn');
    const stopLiveBtn = document.getElementById('stopLiveBtn');
    const liveIndicator = document.getElementById('liveIndicator');
    const liveStatusTxt = document.getElementById('liveStatusTxt');
    const statusLog = document.getElementById('statusLog');
    const canvas = document.getElementById('visualizer');
    const canvasCtx = canvas.getContext('2d');
    const exportBtn = document.getElementById('exportBtn');
    const pitchShiftInput = document.getElementById('pitchShift');
    const rvcModelInput = document.getElementById('rvcModel');

    const bindSlider = (id, valId) => {
        document.getElementById(id).addEventListener('input', (e) => {
            document.getElementById(valId).innerText = e.target.value;
            updateDSPParameters();
        });
    };
    
    bindSlider('gateThreshold', 'gateThresholdVal');
    bindSlider('gateRelease', 'gateReleaseVal');
    bindSlider('eqLow', 'eqLowVal');
    bindSlider('eqMid', 'eqMidVal');
    bindSlider('eqHigh', 'eqHighVal');
    bindSlider('echoTime', 'echoTimeVal');
    bindSlider('echoFeedback', 'echoFeedbackVal');
    bindSlider('reverbSize', 'reverbSizeVal');
    bindSlider('fxMix', 'fxMixVal');

    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;

    async function getMicrophones() {
        try {
            await navigator.mediaDevices.getUserMedia({ audio: true });
            const devices = await navigator.mediaDevices.enumerateDevices();
            const audioDevices = devices.filter(device => device.kind === 'audioinput');
            micSelect.innerHTML = '';
            audioDevices.forEach(device => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                option.text = device.label || `Studio-Mic ${micSelect.length + 1}`;
                micSelect.appendChild(option);
            });
            statusLog.innerText = "Audio-Eingangsmatrix geladen. Dynamik- & FX-Module kalibriert.";
        } catch (err) {
            statusLog.innerText = "I/O Fehler: Kein Studiomikrofon gefunden. " + err.message;
        }
    }

    pitchShiftInput.addEventListener('input', () => {
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ pitch_shift: pitchShiftInput.value }));
        }
    });

    function updateDSPParameters() {
        gateThreshold = parseFloat(document.getElementById('gateThreshold').value);
        gateReleaseTime = parseFloat(document.getElementById('gateRelease').value) / 1000;

        if (!audioContext) return;
        
        const lowGain = parseFloat(document.getElementById('eqLow').value);
        const midGain = parseFloat(document.getElementById('eqMid').value);
        const highGain = parseFloat(document.getElementById('eqHigh').value);

        if (lowEQNode) lowEQNode.gain.setValueAtTime(lowGain, audioContext.currentTime);
        if (midEQNode) midEQNode.gain.setValueAtTime(midGain, audioContext.currentTime);
        if (highEQNode) highEQNode.gain.setValueAtTime(highGain, audioContext.currentTime);

        const eTime = parseFloat(document.getElementById('echoTime').value);
        const eFeedback = parseFloat(document.getElementById('echoFeedback').value) / 100;
        const mix = parseFloat(document.getElementById('fxMix').value) / 100;

        if (delayNode) delayNode.delayTime.setValueAtTime(eTime, audioContext.currentTime);
        if (delayFeedback) delayFeedback.gain.setValueAtTime(eFeedback, audioContext.currentTime);
        
        if (dryGain && wetGain) {
            dryGain.gain.setValueAtTime(1 - mix, audioContext.currentTime);
            wetGain.gain.setValueAtTime(mix, audioContext.currentTime);
        }
    }

    function createReverbImpulseResponse(context, targetSize) {
        const rate = context.sampleRate;
        const len = rate * 2.5; 
        const impulse = context.createBuffer(2, len, rate);
        const left = impulse.getChannelData(0);
        const right = impulse.getChannelData(1);

        for (let i = 0; i < len; i++) {
            const decay = Math.exp(-i / (rate * targetSize));
            left[i] = (Math.random() * 2 - 1) * decay;
            right[i] = (Math.random() * 2 - 1) * decay;
        }
        return impulse;
    }

    startLiveBtn.addEventListener('click', async () => {
        const deviceId = micSelect.value;
        const targetSampleRate = parseInt(document.getElementById('sampleRate').value);

        socket = new WebSocket("ws://127.0.0.1:8000/ws/live");
        socket.binaryType = "arraybuffer";

        socket.onopen = async () => {
            statusLog.innerText = "Verbindung etabliert. Initialisiere Studio-Dynamics...";
            nextPlayTime = 0; 
            audioChunks = [];
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        deviceId: deviceId ? { exact: deviceId } : undefined,
                        echoCancellation: false, noiseSuppression: false, autoGainControl: false,
                        latency: { ideal: 0.002, max: 0.005 }
                    }
                });

                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: targetSampleRate, latencyHint: 'interactive'
                });

                mediaStreamSource = audioContext.createMediaStreamSource(stream);
                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;

                lowEQNode = audioContext.createBiquadFilter();
                lowEQNode.type = "lowshelf";
                lowEQNode.frequency.setValueAtTime(100, audioContext.currentTime);

                midEQNode = audioContext.createBiquadFilter();
                midEQNode.type = "peaking";
                midEQNode.Q.setValueAtTime(1.0, audioContext.currentTime);
                midEQNode.frequency.setValueAtTime(2500, audioContext.currentTime);

                highEQNode = audioContext.createBiquadFilter();
                highEQNode.type = "highshelf";
                highEQNode.frequency.setValueAtTime(10000, audioContext.currentTime);

                dryGain = audioContext.createGain();
                wetGain = audioContext.createGain();
                
                delayNode = audioContext.createDelay(1.0);
                delayFeedback = audioContext.createGain();
                delayNode.connect(delayFeedback);
                delayFeedback.connect(delayNode); 

                reverbNode = audioContext.createConvolver();
                const rSize = parseFloat(document.getElementById('reverbSize').value);
                reverbNode.buffer = createReverbImpulseResponse(audioContext, rSize);

                mediaStreamSource.connect(lowEQNode);
                lowEQNode.connect(midEQNode);
                midEQNode.connect(highEQNode);

                highEQNode.connect(dryGain);
                highEQNode.connect(delayNode);
                
                delayNode.connect(reverbNode);
                reverbNode.connect(wetGain);

                processorNode = audioContext.createScriptProcessor(1024, 1, 1);
                dryGain.connect(processorNode);
                wetGain.connect(processorNode);

                processorNode.connect(analyser);
                analyser.connect(audioContext.destination); 

                updateDSPParameters();

                processorNode.onaudioprocess = (e) => {
                    const inputData = e.inputBuffer.getChannelData(0); 
                    const pcmData = new Int16Array(inputData.length);
                    
                    let sumSquares = 0;
                    for (let i = 0; i < inputData.length; i++) {
                        sumSquares += inputData[i] * inputData[i];
                    }
                    const rms = Math.sqrt(sumSquares / inputData.length);
                    const db = rms > 0.00001 ? 20 * Math.log10(rms) : -100;

                    const currentTime = audioContext.currentTime;
                    if (db > gateThreshold) {
                        isGateOpen = true;
                        gateLastActiveTime = currentTime;
                    } else {
                        if (currentTime - gateLastActiveTime > gateReleaseTime) {
                            isGateOpen = false;
                        }
                    }

                    for (let i = 0; i < inputData.length; i++) {
                        const sampleValue = isGateOpen ? inputData[i] : 0.0;
                        pcmData[i] = Math.max(-1, Math.min(1, sampleValue)) * 0x7FFF;
                    }

                    if (socket.readyState === WebSocket.OPEN) {
                        socket.send(pcmData.buffer);
                    }
                };

                socket.onmessage = (event) => {
                    const arrayBuffer = event.data;
                    const int16Array = new Int16Array(arrayBuffer);
                    audioChunks.push(int16Array);

                    const float32Data = new Float32Array(int16Array.length);
                    for (let i = 0; i < int16Array.length; i++) {
                        float32Data[i] = int16Array[i] / 0x7FFF;
                    }

                    const audioBuffer = audioContext.createBuffer(1, float32Data.length, targetSampleRate);
                    audioBuffer.getChannelData(0).set(float32Data);

                    const bufferSource = audioContext.createBufferSource();
                    bufferSource.buffer = audioBuffer;
                    bufferSource.connect(audioContext.destination);

                    const currentTime = audioContext.currentTime;
                    if (nextPlayTime < currentTime) {
                        nextPlayTime = currentTime + BUFFER_LATENCY_SECS;
                    }
                    bufferSource.start(nextPlayTime);
                    nextPlayTime += audioBuffer.duration;
                };

                visualize(analyser);

                startLiveBtn.style.display = 'none';
                stopLiveBtn.style.display = 'block';
                liveIndicator.className = "status-tag active";
                liveIndicator.innerText = "● LIVE-INFERENZ + DYNAMICS";
                liveStatusTxt.innerText = `DSP BUFFER: ACTIVE (${targetSampleRate}Hz)`;
                statusLog.innerText = `Gating & Signalprozessor aktiv. Nebengeräusche werden unterdrückt.`;
                exportBtn.disabled = true;

            } catch (err) {
                statusLog.innerText = "Matrix Routing fehlgeschlagen: " + err.message;
            }
        };

        socket.onerror = (err) => {
            statusLog.innerText = "RVC-Server antwortet nicht. Bitte führe zuerst die 'run.bat' aus.";
        };
    });

    stopLiveBtn.addEventListener('click', () => {
        if (processorNode) processorNode.disconnect();
        if (mediaStreamSource) mediaStreamSource.disconnect();
        if (stream) stream.getTracks().forEach(track => track.stop());
        if (audioContext) audioContext.close();
        if (socket) socket.close();
        cancelAnimationFrame(animationId);
        
        startLiveBtn.style.display = 'block';
        stopLiveBtn.style.display = 'none';
        liveIndicator.className = "status-tag";
        liveIndicator.innerText = "● OFFLINE";
        liveStatusTxt.innerText = "MATRIX: STANDBY";
        statusLog.innerText = "DSP getrennt. Aufgenommener Stream bereit für Stereo Master Bounce.";
        exportBtn.disabled = false;
    });

    function visualize(analyser) {
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        function draw() {
            animationId = requestAnimationFrame(draw);
            analyser.getByteTimeDomainData(dataArray);
            canvasCtx.fillStyle = '#040406';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            canvasCtx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=40) {
                canvasCtx.beginPath(); canvasCtx.moveTo(i, 0); canvasCtx.lineTo(i, canvas.height); canvasCtx.stroke();
            }
            for(let j=0; j<canvas.height; j+=30) {
                canvasCtx.beginPath(); canvasCtx.moveTo(0, j); canvasCtx.lineTo(canvas.width, j); canvasCtx.stroke();
            }
            canvasCtx.lineWidth = 2;
            
            canvasCtx.strokeStyle = isGateOpen ? '#00ff66' : '#ff0055';
            canvasCtx.shadowBlur = 8;
            canvasCtx.shadowColor = isGateOpen ? '#00ff66' : '#ff0055';
            
            canvasCtx.beginPath();
            const sliceWidth = canvas.width * 1.0 / bufferLength;
            let x = 0;
            for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0;
                const y = v * canvas.height / 2;
                if (i === 0) canvasCtx.moveTo(x, y); else canvasCtx.lineTo(x, y);
                x += sliceWidth;
            }
            canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.stroke();
            canvasCtx.shadowBlur = 0;
        }
        draw();
    }

    exportBtn.addEventListener('click', async () => {
        const format = document.getElementById('exportFormat').value;
        const sampleRate = document.getElementById('sampleRate').value;
        const pitchShift = document.getElementById('pitchShift').value;
        const modelFile = rvcModelInput.files;
        statusLog.innerText = "Initialisiere Master-Bounce auf dem API Server...";
        
        const blob = new Blob(audioChunks, { type: 'audio/pcm' });
        const formData = new FormData();
        formData.append("audio", blob, "live_session.pcm");
        formData.append("model_name", modelFile ? modelFile.name : "default.pth");
        formData.append("pitch_shift", pitchShift);
        formData.append("format", format);
        formData.append("samplerate", sampleRate);

        try {
            const response = await fetch("http://127.0.0.1:8000/api/transform", {
                method: "POST",
                body: formData
            });
            if(!response.ok) throw new Error("Inferenz- oder Encoding-Fehler am Server.");
            const resultBlob = await response.blob();
            const url = URL.createObjectURL(resultBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `super_impersonator_master_${sampleRate}Hz.${format}`;
            document.body.appendChild(a);
            a.click();
            statusLog.innerText = `Bounce beendet! 2 Stereo-Spuren (inkl. Dynamics & FX) erfolgreich als .${format.toUpperCase()} exportiert.`;
        } catch (err) {
            statusLog.innerText = "Export-Kette unterbrochen: " + err.message;
        }
    });

    getMicrophones();

// Super Impersonator App - Frontend Core Logic // by don24crk
const API_BASE = "http://127.0.0.1:6969";

// DOM-Elemente initialisieren
const rvcModelSelect = document.getElementById("rvc-model-select") || document.createElement("select");
const pitchInput = document.getElementById("vocal-pitch") || document.createElement("input");
const gateThresholdInput = document.getElementById("gate-threshold") || document.createElement("input");
const gateReleaseInput = document.getElementById("gate-release") || document.createElement("input");
const eqLowInput = document.getElementById("eq-low") || document.createElement("input");
const eqMidInput = document.getElementById("eq-mid") || document.createElement("input");
const eqHighInput = document.getElementById("eq-high") || document.createElement("input");
const echoTimeInput = document.getElementById("echo-time") || document.createElement("input");
const echoFeedbackInput = document.getElementById("echo-feedback") || document.createElement("input");
const reverbSizeInput = document.getElementById("reverb-size") || document.createElement("input");
const fxMixInput = document.getElementById("fx-mix") || document.createElement("input");
const matrixStatus = document.getElementById("matrix-status");
const onlineIndicator = document.getElementById("online-indicator");

// 1. Automatischen Scan für RVC Modelle, Indizes und Presets ausführen
function initStudioEngine() {
    fetch(`${API_BASE}/api/models`)
        .then(res => {
            if (!res.ok) throw new Error("Engine offline");
            return res.json();
        })
        .then(data => {
            console.log("[STUDIO] Engine verbunden:", data.applio_version);
            
            // RVC Dropdown befüllen
            rvcModelSelect.innerHTML = "";
            if (data.models.length === 0) {
                rvcModelSelect.innerHTML = '<option value="">Keine .pth Modelle gefunden</option>';
            } else {
                data.models.forEach(model => {
                    const opt = document.createElement("option");
                    opt.value = model;
                    opt.textContent = model;
                    rvcModelSelect.appendChild(opt);
                });
            }
            
            // Status-Anzeige aktualisieren
            if (matrixStatus) matrixStatus.textContent = "MATRIX: STANDBY";
            if (onlineIndicator) {
                onlineIndicator.textContent = "● ONLINE";
                onlineIndicator.style.color = "#00ffcc";
            }
        })
        .catch(err => {
            console.error("[STUDIO] Verbindungsfehler zur Python-Engine:", err);
            if (matrixStatus) matrixStatus.textContent = "MATRIX: ERROR";
            if (onlineIndicator) {
                onlineIndicator.textContent = "● OFFLINE";
                onlineIndicator.style.color = "#ff3333";
            }
        });
}

// 2. Preset auf der Festplatte speichern (POST /api/presets/save)
function saveCurrentPreset(presetName = "Studio_Master_Preset") {
    const payload = {
        preset_name: presetName,
        vocal_pitch: parseFloat(pitchInput.value) || 0,
        gate_threshold: parseFloat(gateThresholdInput.value) || -45,
        gate_release: parseFloat(gateReleaseInput.value) || 150,
        eq_low: parseFloat(eqLowInput.value) || 0,
        eq_mid: parseFloat(eqMidInput.value) || 0,
        eq_high: parseFloat(eqHighInput.value) || 0,
        echo_time: parseFloat(echoTimeInput.value) || 0.3,
        echo_feedback: parseFloat(echoFeedbackInput.value) || 30,
        reverb_size: parseFloat(reverbSizeInput.value) || 0.5,
        fx_mix: parseFloat(fxMixInput.value) || 25
    };

    if (matrixStatus) matrixStatus.textContent = "MATRIX: SAVING...";

    fetch(`${API_BASE}/api/presets/save`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        if (matrixStatus) matrixStatus.textContent = "MATRIX: STANDBY";
    })
    .catch(err => {
        console.error("[PRESET] Fehler beim Speichern:", err);
        alert("Fehler: Verbindung zur Engine fehlgeschlagen.");
    });
}

// 3. Audio-Analyse via FFprobe antriggern
function triggerAudioAnalysis() {
    if (matrixStatus) matrixStatus.textContent = "MATRIX: PROCESSING";
    
    fetch(`${API_BASE}/api/analyze`, { method: "POST" })
        .then(res => res.json())
        .then(data => {
            if (data.ffprobe_active) {
                console.log("[FFPROBE] Container-Stream erfolgreich analysiert.");
                if (matrixStatus) matrixStatus.textContent = "MATRIX: READY";
            }
        })
        .catch(err => console.error("[FFPROBE] Analyse-Fehler:", err));
}

// Event-Listener beim Laden der Seite initialisieren
window.addEventListener("DOMContentLoaded", () => {
    initStudioEngine();
    
    // Knöpfe dynamisch an Funktionen binden
    const liveBtn = document.querySelector("button[onclick*='Live']");
    if (liveBtn) {
        liveBtn.removeAttribute("onclick");
        liveBtn.addEventListener("click", triggerAudioAnalysis);
    }
    
    const bounceBtn = document.querySelector("button[onclick*='Bounce']");
    if (bounceBtn) {
        bounceBtn.removeAttribute("onclick");
        bounceBtn.addEventListener("click", () => {
            const name = prompt("Bitte Preset-Namen eingeben:", "Mein_Dynamics_Preset");
            if (name) saveCurrentPreset(name);
        });
    }
});	

function processAudioFile() {
    const fileInput = document.getElementById("audio-file");
    const codecSelect = document.getElementById("export-codec");
    
    if (!fileInput || fileInput.files.length === 0) {
        alert("Bitte zuerst eine WAV-Audiodatei auswählen!");
        return;
    }
    
    const selectedCodec = codecSelect ? codecSelect.value : "MP3";
    if (matrixStatus) matrixStatus.textContent = `MATRIX: BOUNCING ${selectedCodec}...`;
    
    // Starte visuelle Pegelüberwachung
    animateVUMeter(true);
    
    const config = {
        export_codec: selectedCodec,
        gate_threshold: parseFloat(gateThresholdInput.value) || -45,
        gate_release: parseFloat(gateReleaseInput.value) || 150,
        eq_low: parseFloat(eqLowInput.value) || 0,
        eq_mid: parseFloat(eqMidInput.value) || 0,
        eq_high: parseFloat(eqHighInput.value) || 0,
        echo_time: parseFloat(echoTimeInput.value) || 0.3,
        echo_feedback: parseFloat(echoFeedbackInput.value) || 30,
        reverb_size: parseFloat(reverbSizeInput.value) || 0.5,
        fx_mix: parseFloat(fxMixInput.value) || 25
    };
    
    const formData = new FormData();
    formData.append("config", JSON.stringify(config));
    formData.append("audio", fileInput.files[0]);
    
    fetch(`${API_BASE}/api/process`, {
        method: "POST",
        body: formData
    })
    .then(res => {
        if (!res.ok) throw new Error("Audio-Verarbeitung fehlgeschlagen.");
        
        // Dateiendung dynamisch anhand des Response-Headers oder der Config ermitteln
        const extMapping = { "WAV": "wav", "MP3": "mp3", "FLAC": "flac", "WMA": "wma", "VOB": "vob" };
        const currentExt = extMapping[selectedCodec] || "mp3";
        
        return res.blob().then(blob => ({ blob, ext: currentExt }));
    })
    .then(({ blob, ext }) => {
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `processed_master.${ext}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        
        if (matrixStatus) matrixStatus.textContent = "MATRIX: BOUNCE DONE";
    })
    .catch(err => {
        console.error(err);
        if (matrixStatus) matrixStatus.textContent = "MATRIX: ERROR";
    })
    .finally(() => {
        animateVUMeter(false);
    });
}
