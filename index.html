<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Super Impersonator Studio Workstation</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0f0f11; color: #e2e2e9; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #16161a; padding: 25px; border-radius: 8px; border: 1px solid #23232a; }
        h1 { color: #00e676; text-align: center; text-transform: uppercase; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #1f1f26; padding: 20px; border-radius: 6px; border: 1px solid #2d2d37; }
        .card h3 { margin-top: 0; color: #00b0ff; border-bottom: 1px solid #2d2d37; padding-bottom: 6px; }
        label { display: block; margin: 10px 0 4px; font-size: 13px; color: #a0a0aa; }
        select, input[type="range"], input[type="text"] { width: 100%; background: #0f0f11; color: #fff; border: 1px solid #3a3a44; padding: 8px; border-radius: 4px; box-sizing: border-box; }
        .btn { display: block; width: 100%; background: #00e676; color: #121214; border: none; padding: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 15px; text-transform: uppercase; }
        canvas { background: #000; border-radius: 4px; display: block; margin: 10px auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Engine v3.0 DYNAMICS FX // by don24crk</h1>
        <br>
        <div class="grid">
            <div class="card">
                <h3>🗃️ 01 / Input Signal & Pitch Shift Matrix</h3>
                <label>RVC Modell (.pth)</label>
                <select id="modelSelect"></select>
                <label>Index Datei (.index)</label>
                <select id="indexSelect"></select>
                <label>Vocal Pitch Shift (Halbtöne): <span id="valPitch">0</span></label>
                <input type="range" id="vocalPitch" min="-12" max="12" step="1" value="0">
            </div>

            <div class="card">
                <h3>🎚️ 02 / Studio Dynamics & EQ</h3>
                <label>Gate Threshold: <span id="valGateThresh">-45</span> dB</label>
                <input type="range" id="gateThresh" min="-80" max="-10" step="1" value="-45">
                <label>Gate Release: <span id="valGateRelease">150</span> ms</label>
                <input type="range" id="gateRelease" min="50" max="500" step="10" value="150">
                <label>Low (100 Hz): <span id="valLow">0</span> dB</label>
                <input type="range" id="eqLow" min="-12" max="12" step="0.5" value="0">
                <label>Mid (2.5 kHz): <span id="valMid">0</span> dB</label>
                <input type="range" id="eqMid" min="-12" max="12" step="0.5" value="0">
                <label>High (10 kHz): <span id="valHigh">0</span> dB</label>
                <input type="range" id="eqHigh" min="-12" max="12" step="0.5" value="0">
            </div>

            <div class="card">
                <h3>⏳ 03 / Time & Ambience Matrix</h3>
                <label>Echo Time: <span id="valEchoTime">0.3</span> s</label>
                <input type="range" id="echoTime" min="0.1" max="1.0" step="0.05" value="0.3">
                <label>Echo Feedback: <span id="valEchoFb">30</span> %</label>
                <input type="range" id="echoFb" min="0" max="90" step="5" value="30">
                <label>Reverb Size: <span id="valReverb">0.5</span></label>
                <input type="range" id="reverbSize" min="0.0" max="1.0" step="0.05" value="0.5">
                <label>FX Wet/Dry Mix: <span id="valMix">25</span> %</label>
                <input type="range" id="fxMix" min="0" max="100" step="5" value="25">
            </div>

            <div class="card">
                <h3>💾 04 / Global Presets Storage</h3>
                <label>Preset laden</label>
                <select id="presetSelect"><option value="">Wähle Preset...</option></select>
                <label>Neues Preset Name</label>
                <input type="text" id="presetName" value="Studio_Preset_1">
                <button id="btnSavePreset" class="btn" style="background:#00b0ff; color:white;">Preset Speichern</button>
                <canvas id="vuMeter" width="400" height="25"></canvas>
                <div id="statusStr" style="color: #ffea00; text-align:center;">MATRIX: ONLINE</div>
            </div>
        </div>
        <button id="toggleLive" class="btn">Live-Modus schalten (DSP Verbinden)</button>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:6969";
        const statusStr = document.getElementById('statusStr');

        const setupSlider = (id, lId) => {
            const e = document.getElementById(id);
            e.addEventListener('input', () => document.getElementById(lId).innerText = e.value);
        };
        setupSlider('vocalPitch', 'valPitch'); setupSlider('gateThresh', 'valGateThresh');
        setupSlider('gateRelease', 'valGateRelease'); setupSlider('eqLow', 'valLow');
        setupSlider('eqMid', 'valMid'); setupSlider('eqHigh', 'valHigh');
        setupSlider('echoTime', 'valEchoTime'); setupSlider('echoFb', 'valEchoFb');
        setupSlider('reverbSize', 'valReverb'); setupSlider('fxMix', 'valMix');

        async function loadEngineData() {
            try {
                const res = await fetch(`${API_URL}/api/models`);
                const data = await res.json();
                
                const mSel = document.getElementById('modelSelect');
                mSel.innerHTML = '';
                data.models.forEach(m => mSel.innerHTML += `<option value="${m}">${m}</option>`);
                
                const pSel = document.getElementById('presetSelect');
                pSel.innerHTML = '<option value="">Wähle Preset...</option>';
                data.presets.forEach(p => pSel.innerHTML += `<option value="${p}">${p}</option>`);
            } catch(e) {}
        }

        document.getElementById('presetSelect').addEventListener('change', async (e) => {
            if(!e.target.value) return;
            const res = await fetch(`${API_URL}/api/presets/load/${e.target.value}`);
            const d = await res.json();
            const setVal = (id, lid, v) => { document.getElementById(id).value = v; document.getElementById(lid).innerText = v; };
            setVal('vocalPitch', 'valPitch', d.vocal_pitch); setVal('gateThresh', 'valGateThresh', d.gate_threshold);
            setVal('gateRelease', 'valGateRelease', d.gate_release); setVal('eqLow', 'valLow', d.eq_low);
            setVal('eqMid', 'valMid', d.eq_mid); setVal('eqHigh', 'valHigh', d.eq_high);
            setVal('echoTime', 'valEchoTime', d.echo_time); setVal('echoFb', 'valEchoFb', d.echo_feedback);
            setVal('reverbSize', 'valReverb', d.reverb_size); setVal('fxMix', 'valMix', d.fx_mix);
        });

        document.getElementById('btnSavePreset').addEventListener('click', async () => {
            const pName = document.getElementById('presetName').value;
            const payload = {
                name: pName,
                data: {
                    vocal_pitch: document.getElementById('vocalPitch').value,
                    gate_threshold: document.getElementById('gateThresh').value,
                    gate_release: document.getElementById('gateRelease').value,
                    eq_low: document.getElementById('eqLow').value,
                    eq_mid: document.getElementById('eqMid').value,
                    eq_high: document.getElementById('eqHigh').value,
                    echo_time: document.getElementById('echoTime').value,
                    echo_feedback: document.getElementById('echoFb').value,
                    reverb_size: document.getElementById('reverbSize').value,
                    fx_mix: document.getElementById('fxMix').value
                }
            };
            await fetch(`${API_URL}/api/presets/save`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            loadEngineData();
        });

        let isLive = false, audioCtx, scriptNode, mic;
        document.getElementById('toggleLive').addEventListener('click', async () => {
            const btn = document.getElementById('toggleLive');
            if(!isLive) {
                audioCtx = new AudioContext({sampleRate: 44100});
                const stream = await navigator.mediaDevices.getUserMedia({audio: true});
                mic = audioCtx.createMediaStreamSource(stream);
                scriptNode = audioCtx.createScriptProcessor(4096, 1, 1);
                scriptNode.onaudioprocess = async (e) => {
                    if(!isLive) return;
                    const inD = e.inputBuffer.getChannelData(0), outD = e.outputBuffer.getChannelData(0);
                    const buf = new Int16Array(inD.length);
                    for(let i=0; i<inD.length; i++) { buf[i] = inD[i] < 0 ? inD[i] * 0x8000 : inD[i] * 0x7FFF; }
                    try {
                        const response = await fetch(`${API_URL}/api/process`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/octet-stream',
                                'X-Vocal-Pitch': document.getElementById('vocalPitch').value,
                                'X-Gate-Threshold': document.getElementById('gateThresh').value,
                                'X-Gate-Release': document.getElementById('gateRelease').value,
                                'X-EQ-Low': document.getElementById('eqLow').value,
                                'X-EQ-Mid': document.getElementById('eqMid').value,
                                'X-EQ-High': document.getElementById('eqHigh').value,
'X-Echo-Time': document.getElementById('echoTime').value,
'X-Echo-Feedback': document.getElementById('echoFb').value,
'X-Reverb-Size': document.getElementById('reverbSize').value,
'X-FX-Mix': document.getElementById('fxMix').value
},
body: buf.buffer
});
const outAB = await response.arrayBuffer();
const out16 = new Int16Array(outAB);
for(let i=0; i<outD.length; i++) outD[i] = out16[i]/32768.0;
} catch(err) { for(let i=0; i<outD.length; i++) outD[i] = inD[i]; }
};
mic.connect(scriptNode); scriptNode.connect(audioCtx.destination);
isLive = true; btn.innerText = "Live-Modus trennen (DSP Trennen)"; btn.classList.add('btn-live');
} else {
isLive = false; scriptNode.disconnect(); mic.disconnect(); audioCtx.close();
btn.innerText = "Live-Modus schalten (DSP Verbinden)"; btn.classList.remove('btn-live');
}
});
loadEngineData();
